services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: goflow
      POSTGRES_PASSWORD: goflow
      POSTGRES_DB: goflow
    ports:
      - "5432:5432"
    volumes:
      - goflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://goflow:goflow@db:5432/goflow
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://goflow:goflow@db:5432/goflow
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.tasks.scheduler"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://goflow:goflow@db:5432/goflow
      REDIS_URL: redis://redis:6379/0
    command: ["rq", "worker", "publishing", "content_generation", "--url", "redis://redis:6379/0"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  goflow_pgdata:
